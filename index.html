<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe8d6">
<title>규리네 초밥은 못 참지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/menu-background.webp" fetchpriority="low">
<style>
  :root{ --ink:#6b3f2a; --bg:#ffe8d6; --cream:#fffaf0; --accent:#ff7a8a; --accentD:#e25a6c; --green:#5cc97b; --gold:#ffc83d; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#f6cdb6;overflow:hidden;overscroll-behavior:none;
    font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
    width:min(100vw,calc(100dvh * .62));
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:var(--bg);box-shadow:0 0 40px rgba(107,63,42,.25)}
  #stage{position:relative;width:100%;height:100%;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;
    justify-content:space-between;padding:0 12px;pointer-events:none;color:var(--ink)}
  #hud[hidden]{display:none}
  #stageLabel{font-size:clamp(13px,4vw,17px);letter-spacing:.04em;min-width:0;white-space:nowrap}
  #progress{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
    background:#fff3dc;border:1.5px solid #cf8b55;border-radius:999px;box-shadow:0 1px 0 #b77346;
    padding:3px 12px 3px 4px;font-size:clamp(15px,4.8vw,19px);font-variant-numeric:tabular-nums}
  #progress .chk{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;
    background:#4d895b;color:#fff9ee;font-size:14px}
  #hud[data-mode="endless"] .chk{background:#ac622d}
  #pauseBtn{appearance:none;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:5px;
    width:clamp(72px,23vw,94px);aspect-ratio:299/130;margin-left:auto;padding:0;border:0;border-radius:999px;
    background:transparent url('assets/restaurant/ui_pause.webp') center/contain no-repeat;
    color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
  #pauseBtn::before{content:'';width:3px;height:.74em;border-inline:2px solid currentColor;box-sizing:content-box}
  #pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #pauseBtn:active{transform:scale(.94)}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(49,28,30,.64);padding:clamp(12px,4vw,22px);z-index:5}
  #overlay.show{display:flex}
  #overlay[data-view="menu"]{background:linear-gradient(#2a1d3170,#382222a0),url('assets/menu-background.webp') center/cover,#4e3330}
  .card{width:100%;max-width:390px;max-height:100%;overflow:auto;color:#512b24;
    background:linear-gradient(150deg,#fff6e2,#f6e3bc);border:2px solid #dda565;border-radius:20px;
    padding:17px clamp(12px,4vw,20px);text-align:center;box-shadow:0 5px 0 #7b452c,0 14px 34px #24151ba8}
  .card[data-view="menu"]{padding-top:12px}
  .menu-banner{position:relative;isolation:isolate;display:flex;align-items:end;min-height:94px;overflow:hidden;
    margin-bottom:12px;padding:15px 14px;border-radius:12px;text-align:left;color:#ffeec9;
    background:linear-gradient(88deg,#231c37ee,#38234022),url('assets/title.webp') center 51%/cover}
  .menu-banner h2{margin:0;line-height:1.15}
  .pause-banner{display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:72px;
    margin-bottom:10px;padding:5px 12px;background:#edcf9c;border:1px solid #cf9c62;border-radius:12px}
  .pause-banner p{margin:0}
  .pause-banner img{width:64px;height:64px;object-fit:contain}
  .card h1{margin:0 0 4px;font-size:40px;font-weight:400;color:var(--accent);text-shadow:0 3px 0 #fff,0 5px 0 rgba(226,90,108,.25)}
  .card h2{margin:0 0 6px;font-size:26px;font-weight:400}
  .card p{margin:0 0 12px;font-size:14px;line-height:1.42;color:#744a37;word-break:keep-all}
  .card .pause-banner p{margin:0}
  .btn{display:block;width:100%;border:1px solid #a83728;border-radius:11px;padding:10px;margin-top:8px;
    font:inherit;font-size:17px;cursor:pointer;background:#be4935;color:#fff5db;box-shadow:0 3px 0 #873224}
  .btn.sub{background:#fff0cf;border-color:#d3a16a;color:#633e31;box-shadow:0 3px 0 #c59260}
  .card button:focus-visible{outline:2px solid #3f3e67;outline-offset:2px}
  .btn:active{transform:translateY(3px);box-shadow:none}
  .row{display:flex;gap:8px}.row .btn{font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
  .grid button{aspect-ratio:1;border:1px solid #342843;border-radius:10px;font:inherit;font-size:18px;
    background:#504463;color:#fff3d6;cursor:pointer;box-shadow:0 3px 0 #30253d}
  .grid button.done{background:#497154;border-color:#35563e;box-shadow:0 3px 0 #35563e}
  .grid button:disabled{background:#ebdec5;border-color:#dbc6a5;color:#90755e;box-shadow:none;cursor:default}
  .grid button:not(:disabled):active{transform:translateY(3px);box-shadow:none}
  .pager{align-items:center}.pager .btn{flex:0 0 64px}.pager .pg{flex:1;font-size:16px;margin-top:8px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.small{font-size:14px;padding:8px 9px}.ver{margin-top:10px;font-size:12px;color:#795844}
  .tabs{display:flex;gap:5px;background:#e4c99e;border-radius:11px;padding:4px;margin:8px 0 11px}
  .tabs button{flex:1;border:0;border-radius:8px;padding:8px 4px;font:inherit;font-size:16px;background:transparent;color:#624632;cursor:pointer}
  .tabs button.on{background:#503f58;color:#fff2d6}
  .card h3{margin:16px 0 6px;font-size:17px;font-weight:400}
  .rank{background:#fff;border-radius:14px;padding:4px 10px;font-size:14px;margin-bottom:6px;font-variant-numeric:tabular-nums}
  .rank>div{display:grid;grid-template-columns:26px 1.3fr 1fr 1.1fr;gap:4px;padding:5px 0;border-bottom:1px dashed #f3dccd;text-align:right}
  .rank>div:last-child{border-bottom:0}.rank b{font-weight:400;color:#9b3d2a;text-align:center}
  .rank .me{background:#fff3c9;border-radius:8px;margin:0 -6px;padding:5px 6px}
  .rank.empty{padding:14px;color:#c4a591}
  .score{font-size:46px;color:#9b3d2a;line-height:1.1;margin:4px 0}.score small{font-size:20px;margin-left:2px}
  .show .card{animation:cardIn .3s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes cardIn{from{transform:translateY(24px) scale(.9);opacity:0}}
  /* ---- 타이틀 화면 ---- */
  #splash{position:absolute;inset:0;z-index:4;overflow:hidden;background:#3b2a3f}
  #splash .bg{position:absolute;left:-8%;top:-8%;width:116%;height:116%;object-fit:cover;filter:blur(18px) brightness(.8)}
  #art{position:absolute;transform-origin:50% 55%;animation:breathe 5s ease-in-out infinite}
  #art>img{width:100%;height:100%;display:block;pointer-events:none}
  @keyframes breathe{50%{transform:scale(1.02)}}
  #startHot,.glow{position:absolute;left:17.5%;top:83.4%;width:63.8%;height:11.4%;border-radius:999px}
  #startHot{border:0;background:none;padding:0;cursor:pointer;overflow:hidden}
  #startHot i{position:absolute;inset:0;background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.6) 50%,transparent 64%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite}
  @keyframes shine{0%,50%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .glow{pointer-events:none;animation:pulse 1.5s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,225,120,.85)}100%{box-shadow:0 0 0 22px rgba(255,225,120,0)}}
  #startHot:active{background:rgba(255,255,255,.25)}
  #gearHot{position:absolute;left:87%;top:92%;width:11.5%;height:6.6%;border-radius:50%;border:0;background:none;cursor:pointer;padding:0}
  #gearHot:active{background:rgba(255,255,255,.35)}
  #petals{position:absolute;inset:0;pointer-events:none}
  #petals b{position:absolute;top:-6%;background:linear-gradient(135deg,#ffd3e0,#ff9bb8);border-radius:90% 10% 90% 10%;opacity:.9;animation:fall linear infinite}
  @keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sway),55vh) rotate(200deg)}100%{transform:translate(calc(var(--sway)*-0.4),112vh) rotate(420deg)}}
  #splash .spark{position:absolute;width:14px;height:14px;margin:-7px;background:#ffe27a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:spark .7s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
  #splash.go #art{animation:zoomIn .75s cubic-bezier(.5,0,.9,.5) forwards}
  #splash.go #startHot{background:rgba(255,255,255,.65)}
  #splash.go .glow,#splash.go #startHot i{animation:none}
  @keyframes zoomIn{0%{transform:scale(1)}18%{transform:scale(.97)}100%{transform:scale(1.32);filter:brightness(1.35)}}
  /* ---- 미닫이문 전환 ---- */
  #doors{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  #doors.close,#doors.open{pointer-events:auto}
  .door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:#a55734}
  .door img{position:absolute;top:0;width:200%;height:100%;object-fit:cover;max-width:none}
  .door.l img{left:0}.door.r img{right:0}
  .door.l{left:0;transform:translateX(-102%)}.door.r{right:0;transform:translateX(102%)}
  #doors.close .door{transform:none;transition:transform .36s cubic-bezier(.7,0,.9,.6)}
  #doors.open .door{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  .welcome{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.64) rotate(-5deg);opacity:0;white-space:nowrap;
    font-size:clamp(25px,7vw,41px);color:#ffedc2;background:#b74431;border:3px solid #ffe4ad;
    border-radius:14px;padding:.24em .54em;box-shadow:0 4px 0 #783522,0 8px 18px #2d172272}
  #doors.close .welcome{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-5deg);transition:transform .3s cubic-bezier(.2,1.6,.4,1) .36s,opacity .15s .36s}
  #stage.thud{animation:thud .25s}
  @keyframes thud{25%{transform:translateY(5px)}60%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){
    #art,#splash.go #art,#petals b,.glow,#startHot i,#stage.thud,.show .card{animation:none}
    #doors.close .door,#doors.open .door,#doors.close .welcome{transition:none}
  }
  /* ---- 계정 / 로그인 / 개발자 ---- */
  .acct{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 10px;border-radius:12px;background:#fff8e8;border:1px solid #e2bf8c;text-align:left;font-size:14px}
  .acct .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .who small{display:block;font-size:12px;color:#8b6a52}
  .acct .btn{width:auto;margin:0;padding:6px 12px;font-size:14px;flex:none}
  .pv{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:13px;flex:none;vertical-align:-5px}
  .pv.kakao{background:#FEE500;color:#191600}.pv.naver{background:#03C75A;color:#fff}.pv.google{background:#fff;border:1px solid #dadce0}
  .login{display:grid;gap:8px;margin:6px 0 4px}
  .login button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border-radius:12px;font:inherit;font-size:16px;cursor:pointer;border:0;position:relative}
  .login button:active{transform:translateY(2px)}
  .login .kakao{background:#FEE500;color:rgba(0,0,0,.85)}
  .login .naver{background:#03C75A;color:#fff}
  .login .google{background:#fff;color:#1f1f1f;border:1px solid #747775}
  .login svg{width:20px;height:20px;flex:none}
  .login button[disabled]{opacity:.45;cursor:default}
  .note{font-size:12px;color:#8b6a52;margin:8px 0 0;line-height:1.45;word-break:keep-all}
  .err{color:#b3261e;font-size:13px;margin:6px 0 0;min-height:1.2em;word-break:keep-all}
  .field{display:block;width:100%;margin:6px 0 2px;padding:11px 12px;border-radius:11px;border:1.5px solid #d3a16a;background:#fffdf7;
    font:inherit;font-size:18px;color:#512b24;text-align:center;-webkit-user-select:text;user-select:text;touch-action:auto}
  .field:focus{outline:2px solid #503f58;outline-offset:1px}
  .shake{animation:shake .32s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .dev{display:grid;gap:8px;margin:8px 0;text-align:left}
  .dev .tool{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#fff8e8;border:1px solid #e2bf8c}
  .dev .tool div{flex:1;min-width:0}.dev .tool b{display:block;font-weight:400;font-size:15px}
  .dev .tool small{display:block;font-size:12px;color:#8b6a52;word-break:break-all}
  .dev .tool .btn{width:auto;margin:0;padding:7px 12px;font-size:14px;flex:none}
  .dev .tool .btn.armed{background:#b3261e;border-color:#8c1d18;box-shadow:0 3px 0 #6e1712}
  .devbadge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#503f58;color:#fff2d6;font-size:12px;vertical-align:3px}
  .rank.g>div{grid-template-columns:26px 1.5fr 1.2fr .8fr}
  .rank.g span:nth-of-type(1){text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .myrank{margin:0 0 6px;font-size:13px;color:#744a37}.myrank b{font-weight:400;color:#9b3d2a}
  .gmsg{font-size:13px;color:#9b3d2a;margin:6px 0}
  /* ---- 로비(모드 선택) ---- */
  #lobby{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;overflow:hidden;color:#fff4dc;
    background:linear-gradient(#1d1426cc,#1d142600 22%,#1d142600 62%,#1d1426e6),url('assets/menu-background.webp') center/cover,#4e3330;
    padding:max(8px,env(safe-area-inset-top)) clamp(10px,3.5vw,16px) max(12px,env(safe-area-inset-bottom))}
  #lobby[hidden]{display:none}
  .lb-top{display:flex;align-items:center;gap:8px;flex:none}
  .lb-round{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid #f3cf8e;background:#3a2620e6;color:#ffe8b8;
    font:inherit;font-size:20px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #1c110e;padding:0}
  .lb-round:active{transform:translateY(2px);box-shadow:none}
  .lb-acct{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 6px;border:0;cursor:pointer;
    background:url('assets/restaurant/ui_hint.webp') center/100% 100% no-repeat;color:#ffeccb;font:inherit;font-size:15px;text-align:left}
  .lb-acct .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-acct .go{flex:none;padding:5px 12px;border-radius:999px;background:#be4935;color:#fff5db;font-size:14px;box-shadow:0 2px 0 #7a2a1d}
  .lb-logo{flex:none;height:clamp(64px,19dvh,178px);aspect-ratio:870/470;max-width:92%;margin:4px auto 0;
    background:url('assets/title.webp') 43% 3.2%/108% auto no-repeat;filter:drop-shadow(0 6px 10px #0009);animation:logoIn .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes logoIn{from{transform:scale(.85) translateY(-10px);opacity:0}}
  .lb-tabs{flex:none;display:flex;gap:10px;margin:8px 0 10px}
  .lb-tab{flex:1;height:54px;border:0;cursor:pointer;font:inherit;font-size:clamp(17px,5vw,21px);display:flex;align-items:center;justify-content:center;gap:6px;
    background:url('assets/restaurant/ui_hint.webp') center/100% 100% no-repeat;color:#e9cfa6;opacity:.92;transition:transform .15s}
  .lb-tab .ic{font-size:1.1em}
  .lb-tab.on{background-image:url('assets/restaurant/ui_pause.webp');color:#8f2f20;opacity:1;transform:translateY(-3px) scale(1.04);filter:drop-shadow(0 5px 6px #0007)}
  .lb-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border-radius:20px;padding:10px;
    background:#fff6e2f2;border:3px solid #e4705a;box-shadow:inset 0 0 0 3px #fff3dc,0 8px 18px #0008;color:#512b24}
  .lb-plates{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);align-content:center;gap:clamp(4px,1.6vw,10px) clamp(2px,1vw,6px)}
  .plate{position:relative;aspect-ratio:1;border:0;padding:0;cursor:pointer;background:url('assets/restaurant/ui_plate.webp') center/contain no-repeat;
    font:inherit;font-size:clamp(17px,5.2vw,22px);color:#7a3b22;display:grid;place-items:center;transition:transform .12s}
  .plate:active{transform:scale(.92)}
  .plate.done::after{content:'✓';position:absolute;right:2%;top:2%;width:38%;aspect-ratio:1;display:grid;place-items:center;font-size:.62em;color:#fff;
    background:url('assets/restaurant/ui_badge.webp') center/contain no-repeat}
  .plate.now{animation:bob 1.4s ease-in-out infinite}
  .plate.now::before{content:'';position:absolute;inset:6%;border-radius:50%;box-shadow:0 0 0 3px #ffc83d,0 0 14px 4px #ffc83d99}
  .plate.sel{transform:scale(1.12)}
  .plate.sel::before{content:'';position:absolute;inset:4%;border-radius:50%;box-shadow:0 0 0 4px #be4935,0 0 14px 3px #be493566}
  .plate.lock{filter:grayscale(.85) brightness(.9);opacity:.55;cursor:default;font-size:clamp(13px,3.8vw,16px)}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .lb-pager{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
  .lb-pager button{width:44px;height:36px;border-radius:12px;border:2px solid #d3a16a;background:#fff0cf;color:#633e31;font:inherit;font-size:16px;cursor:pointer;box-shadow:0 3px 0 #c59260}
  .lb-pager button:disabled{opacity:.35;box-shadow:none;cursor:default}
  .lb-pager .info{flex:1;text-align:center;font-size:14px;color:#744a37;line-height:1.25}
  .lb-pager .info b{font-weight:400;color:#9b3d2a}
  .lb-hero{flex:none;display:flex;align-items:flex-end;gap:4px;margin:-4px 0 6px}
  .lb-hero img{width:clamp(76px,24vw,104px);flex:none;filter:drop-shadow(0 4px 4px #0003)}
  .lb-bubble{flex:1;position:relative;min-height:64px;display:flex;flex-direction:column;justify-content:center;padding:8px 12px;border-radius:16px;
    background:#fff;border:2.5px solid #e4705a;font-size:14px;line-height:1.35;color:#5b3326}
  .lb-bubble::before{content:'';position:absolute;left:-12px;bottom:16px;border:7px solid transparent;border-right:9px solid #e4705a}
  .lb-bubble .myrank{margin:0;font-size:14px;color:#5b3326}
  .lb-bubble .mini{margin-top:6px;align-self:flex-start;border:0;border-radius:999px;background:#be4935;color:#fff5db;font:inherit;font-size:13px;padding:5px 12px;cursor:pointer;box-shadow:0 2px 0 #7a2a1d}
  .lb-panel h3{margin:2px 0 6px;font-size:16px;font-weight:400;text-align:center;color:#8f2f20}
  .lb-list{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:12px}
  #lobby .rank{margin:0;border-radius:12px;background:#fffdf7;border:1px solid #f0d6bd}
  #lobby .rank.g>div{grid-template-columns:30px 1.6fr 1.2fr .9fr;padding:7px 2px;font-size:15px}
  #lobby .rank.g>div:nth-child(1) b,#lobby .rank.g>div:nth-child(2) b,#lobby .rank.g>div:nth-child(3) b{color:transparent;position:relative}
  #lobby .rank.g>div:nth-child(-n+3) b::after{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;color:initial}
  #lobby .rank.g>div:nth-child(1) b::after{content:'🥇'}#lobby .rank.g>div:nth-child(2) b::after{content:'🥈'}#lobby .rank.g>div:nth-child(3) b::after{content:'🥉'}
  .lb-cta{flex:none;position:relative;overflow:hidden;margin:12px auto 0;width:min(100%,360px);height:clamp(58px,8.5vh,70px);border-radius:999px;cursor:pointer;
    border:3px solid #ffd27a;background:linear-gradient(#d65a40,#a8371f);color:#fff7df;font:inherit;font-size:clamp(22px,6.6vw,28px);letter-spacing:.02em;

<script>
'use strict';
/* =====================================================================
   1. 리소스 (ASSETS)
   - 기본값은 아래 SVG 로 그린 그림입니다.
   - PNG 로 바꾸려면 저장소에 assets/ 폴더를 만들고 ASSET_URLS 에 경로를 넣으세요.
     예) ASSET_URLS.ing_tuna = 'assets/ing_tuna.png';
         ASSET_URLS.sushi_tuna = 'assets/sushi_tuna.png';
   - sushi_* 를 비워 두면 재료 그림 + 밥(얼굴 포함)으로 자동 합성합니다.
   ===================================================================== */
const ASSET_ROOT = 'assets/restaurant/';
const ASSET_URLS = {};
const CHEF_STATES = ['idle','blink','cook','serve'];
const GUEST_STATES = ['idle','blink','angry','happy'];
const GUESTS = ['calico','rabbit','shiba','tuxedo'];
const UI_PARTS = ['belt','kitchen','board','bubble','badge','progress'];
const SLAB = 'M8 40C8 28 17 20 30 18L48 15C58 14 61 23 57 32C53 43 43 49 30 50L16 51C10 51 8 46 8 40Z';
const GLOSS = '<ellipse cx="22" cy="29" rx="6" ry="3" transform="rotate(-24 22 29)" fill="#fff" opacity=".75"/><circle cx="31" cy="24" r="1.8" fill="#fff" opacity=".75"/>';
const svg = inner => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const TYPES = {

    <path d="M20 43C26 36 35 31 50 28M30 45C36 40 43 37 53 35" stroke="#ffb3c0" stroke-width="3" fill="none"/>${GLOSS}`)},

    <path d="M21 41C21 32 41 27 44 33C46 38 34 41 32 36" stroke="#f2b632" stroke-width="3" fill="none"/>

  shrimp:{name:'새우', svg:svg(`<path d="M51 40L61 44L54 48L58 56L45 47Z" fill="#ff7a5c" stroke="#c9573a" stroke-width="3.5"/>
    <path d="M9 41C7 25 22 13 38 16C51 18 58 29 52 41C50 33 43 29 35 30C27 31 24 37 26 43C21 49 10 49 9 41Z" fill="#ffc9b8" stroke="#d9705a" stroke-width="3.5"/>
    <path d="M20 25L25 33M30 20L33 29M41 20L41 29" stroke="#ff957c" stroke-width="3" fill="none"/>
    <ellipse cx="16" cy="33" rx="3.5" ry="2.2" transform="rotate(-50 16 33)" fill="#fff" opacity=".8"/>`)},
  salmon:{name:'연어', svg:svg(`<path d="${SLAB}" fill="#ffa155" stroke="#c9682a" stroke-width="3.5"/>

  cucumber:{name:'오이', gunkan:true, svg:svg(`<circle cx="32" cy="32" r="23" fill="#6cc76a" stroke="#3a8f3a" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="16.5" fill="#e3f9c4"/>
    <path d="M32 19V45M19 32H45M23 23L41 41M41 23L23 41" stroke="#bfe79a" stroke-width="2.4"/>
    <circle cx="32" cy="32" r="4.5" fill="#f4ffe0"/><circle cx="20" cy="20" r="2.2" fill="#fff" opacity=".8"/>`)},
  octopus:{name:'문어', svg:svg(`<path d="M13 47C7 30 18 13 34 13C48 13 57 24 55 36C53 46 42 51 34 46C28 42 28 34 33 32" fill="none" stroke="#b8446a" stroke-width="15.5"/>
    <path d="M13 47C7 30 18 13 34 13C48 13 57 24 55 36C53 46 42 51 34 46C28 42 28 34 33 32" fill="none" stroke="#ff9db8" stroke-width="10"/>
    <g fill="#fff"><circle cx="13" cy="36" r="2.6"/><circle cx="18" cy="23" r="2.6"/><circle cx="31" cy="14" r="2.6"/><circle cx="46" cy="18" r="2.6"/><circle cx="54" cy="31" r="2.6"/><circle cx="46" cy="45" r="2.6"/></g>`)},
  roe:{name:'연어알', gunkan:true, svg:svg(`<ellipse cx="32" cy="46" rx="26" ry="10" fill="#7ed67a" stroke="#3a8f3a" stroke-width="3.5"/>
    <g fill="#ff7a45" stroke="#cf4a1c" stroke-width="2.6"><circle cx="19" cy="38" r="8.5"/><circle cx="45" cy="38" r="8.5"/><circle cx="32" cy="42" r="8.5"/><circle cx="25" cy="26" r="8.5"/><circle cx="39" cy="26" r="8.5"/></g>
    <g fill="#fff" opacity=".85"><circle cx="16" cy="35" r="2.4"/><circle cx="42" cy="35" r="2.4"/><circle cx="29" cy="39" r="2.4"/><circle cx="22" cy="23" r="2.4"/><circle cx="36" cy="23" r="2.4"/></g>`)},
  eel:{name:'장어', svg:svg(`<path d="${SLAB}" fill="#c9773a" stroke="#7d3f14" stroke-width="3.5"/>
    <path d="M19 45L24 28M28 46L33 25M37 45L42 23M46 42L50 22" stroke="#99531f" stroke-width="3" fill="none"/>
    <path d="M17 35C24 28 33 24 47 22" stroke="#ffd09c" stroke-width="2.8" fill="none"/>`)},
};
const TYPE_ORDER = ['tuna','egg','shrimp','salmon','cucumber','octopus','roe','eel'];
const SPR = { ing:{}, sushi:{}, chef:{}, guests:{}, ui:{} };
for(const k of TYPE_ORDER){
  ASSET_URLS['ing_'+k]=ASSET_ROOT+'ing_'+k+'.webp';
  ASSET_URLS['sushi_'+k]=ASSET_ROOT+'sushi_'+k+'.webp';
}

function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
async function loadAssets(){
  await Promise.all([
    ...CHEF_STATES.map(async state=>{ SPR.chef[state]=await loadImg(ASSET_ROOT+'gyuri_'+state+'.webp'); }),
    ...GUESTS.map(async guest=>{
      const images=await Promise.all(GUEST_STATES.map(state=>loadImg(ASSET_ROOT+guest+'_'+state+'.webp')));
      SPR.guests[guest]=Object.fromEntries(GUEST_STATES.map((state,i)=>[state,images[i]]));
    }),
    ...UI_PARTS.map(async part=>{ SPR.ui[part]=await loadImg(ASSET_ROOT+'ui_'+part+'.webp'); }),
    ...TYPE_ORDER.map(async k=>{
    let im = ASSET_URLS['ing_'+k] ? await loadImg(ASSET_URLS['ing_'+k]) : null;
    if(!im) im = await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(TYPES[k].svg));
    const c=document.createElement('canvas'); c.width=c.height=128;
    if(im) c.getContext('2d').drawImage(im,0,0,128,128);
    SPR.ing[k]=c;
    const su = ASSET_URLS['sushi_'+k] ? await loadImg(ASSET_URLS['sushi_'+k]) : null;
    SPR.sushi[k] = su || composeSushi(k);
    }),
  ]);
}
function composeSushi(k){            // 밥 + 재료 + 얼굴을 합성한 초밥 그림
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.lineJoin='round'; g.lineCap='round';
  g.fillStyle='rgba(107,63,42,.16)'; g.beginPath(); g.ellipse(64,114,46,8,0,0,7); g.fill();
  const gunkan=TYPES[k].gunkan;
  if(gunkan){
    g.fillStyle='#fffdf8'; g.strokeStyle='#d9b99b'; g.lineWidth=5; rr(g,22,48,84,34,16); g.fill(); g.stroke();
    g.fillStyle='#4a5a4e'; g.strokeStyle='#2f3d33'; rr(g,17,60,94,52,18); g.fill(); g.stroke();
    g.drawImage(SPR.ing[k],25,2,78,78);
  }else{
    g.fillStyle='#fffdf8'; g.strokeStyle='#d9b99b'; g.lineWidth=5; rr(g,17,56,94,56,24); g.fill(); g.stroke();
    g.drawImage(SPR.ing[k],9,-8,110,110);
  }
  // 얼굴
  const ey=96, eye=gunkan?'#fff':'#5a3626';
  g.fillStyle=eye; g.beginPath(); g.arc(49,ey,4.6,0,7); g.fill(); g.beginPath(); g.arc(79,ey,4.6,0,7); g.fill();
  if(!gunkan){ g.fillStyle='#fff'; g.beginPath(); g.arc(47.5,ey-1.6,1.6,0,7); g.fill(); g.beginPath(); g.arc(77.5,ey-1.6,1.6,0,7); g.fill(); }
  g.strokeStyle=eye; g.lineWidth=2.6; g.beginPath(); g.arc(64,ey+1,4.5,Math.PI*0.15,Math.PI*0.85); g.stroke();
  g.fillStyle='rgba(255,120,140,.55)'; g.beginPath(); g.ellipse(37,ey+6,6,3.6,0,0,7); g.fill(); g.beginPath(); g.ellipse(91,ey+6,6,3.6,0,0,7); g.fill();
  return c;
}

/* =====================================================================
   2. 스테이지 데이터
   ===================================================================== */
const VERSION = 'v1.1';
const MAX_STAGE = 100, PAGE = 20, COLS = 5;
const MIN_RAIL_SLOTS = 18; // 투입 위치의 간격은 게이지 용량과 별개로 유지한다.
const FIRST_ARRIVALS=[0.12,0.48,0.84,1.2], ARRIVE_TIME=0.20, LEAVE_TIME=0.44;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function stageConfig(n){
  return {
    types:     Math.min(3 + Math.floor((n+1)/5), TYPE_ORDER.length), // 재료 종류 수
    customers: Math.min(6 + Math.floor(n*0.6), 32),                  // 손님 수
    orderMin:  n>50 ? 4 : 3,
    orderMax:  Math.min(4 + Math.floor(n/3), 8),                     // 손님 1명 주문량
    capacity:  10 + Math.floor((n-1)/12),                           // 주문이 복잡해질수록 벨트 여유를 늘린다
    mix:       Math.min(2 + n*0.045, 5.6),                           // 재료 섞임 정도(클수록 어려움)
    loop:      Math.max(7, 11 - n*0.05),                             // 벨트 한 바퀴(초)
    spawnGap:  0.6,                                                  // 다음 손님 등장 간격(초)
  };
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SKINS=[['#ffe0c7','#f2bfa0'],['#ffd3b0','#eeb089'],['#f0bd94','#d99c6c'],['#c98f62','#a8703f'],['#fff0e2','#f5cdb4']];
const HAIRS=['#5a3a2e','#8a5a3c','#e08a4a','#f2c14e','#4a4f7a','#c46a9a','#3d3340'];
const SHIRTS=['#ffa48c','#8fd3e8','#a9df8a','#ffd866','#cfa8f0','#ff9bb5','#8fa8ff'];
function randomLook(){ const s=pick(SKINS); return {skin:s[0],skinD:s[1],hairC:pick(HAIRS),hair:rnd(0,2),shirt:pick(SHIRTS),guest:pick(GUESTS)}; }

function buildStage(n,mixScale=1){
  const cfg=stageConfig(n); cfg.mix*=mixScale; const types=TYPE_ORDER.slice(0,cfg.types);
  const queue=[]; let total=0, last=null;
  for(let i=0;i<cfg.customers;i++){
    let t; do{ t=pick(types); }while(t===last);
    last=t; const need=rnd(cfg.orderMin,cfg.orderMax);
    queue.push({type:t,need,look:randomLook()}); total+=need;
  }
  // 손님 주문량과 정확히 같은 양의 재료를, 등장 순서와 비슷하게 섞어 5줄에 나눠 쌓는다
  const runs=[];
  queue.forEach((c,i)=>{ let left=c.need; while(left>0){ const k=Math.min(left,rnd(1,3)); runs.push({type:c.type,k,key:i+Math.random()*cfg.mix}); left-=k; }});
  runs.sort((a,b)=>a.key-b.key);
  const cols=Array.from({length:COLS},()=>[]);
  for(const r of runs){
    const idx=[0,1,2,3,4].sort((a,b)=>cols[a].length-cols[b].length);
    const c=idx[Math.random()<0.55?0:rnd(1,2)];
    for(let j=0;j<r.k;j++) cols[c].push(r.type);
  }
  return {cfg,queue,cols,total};
}

// 생성 검증: 실제 규칙을 단순화한 시뮬레이션에서 봇이 풀 수 있는 판만 사용한다.
// 봇은 사람보다 불리한 조건(초당 3번 터치, 벨트를 용량-2 까지만 사용)으로 플레이하므로
// 봇이 푼 판은 사람도 풀 수 있다.
function solvable(st){
  const cfg=st.cfg, N=Math.max(cfg.capacity,MIN_RAIL_SLOTS), limit=cfg.capacity-2;
  const tick=cfg.loop/N, len=L.path.len;
  const cols=st.cols.map(c=>c.slice()), queue=st.queue.map(c=>({type:c.type,need:c.need}));
  const seatIdx=L.seatS.map(v=>Math.floor(v/len*N)%N), entryIdx=Math.floor(L.entryS/len*N)%N;
  const arrive=Math.ceil((cfg.spawnGap+LEAVE_TIME+ARRIVE_TIME)/tick)+1, taps=Math.max(1,Math.floor(tick*3));
  const slots=Array(N).fill(null), seats=[null,null,null,null], timer=FIRST_ARRIVALS.map(t=>Math.ceil((t+ARRIVE_TIME)/tick)+1);
  let pending=[], delivered=0, idle=0, t=0;
  while(delivered<st.total){
    if(++t>40000) return false;
    slots.unshift(slots.pop());                                  // 벨트 한 칸 회전
    if(!slots[entryIdx]&&pending.length) slots[entryIdx]=pending.shift();
    for(let k=0;k<4;k++){
      const s=seats[k];
      if(!s){ if(queue.length&&--timer[k]<=0) seats[k]=queue.shift(); continue; }
      if(slots[seatIdx[k]]===s.type){ slots[seatIdx[k]]=null; delivered++; idle=0; if(--s.need===0){ seats[k]=null; timer[k]=arrive; } }
    }
    for(let a=0;a<taps;a++){
      const want={}, have={}; let cnt=pending.length;
      for(const s of seats) if(s) want[s.type]=(want[s.type]||0)+s.need;
      for(const x of slots) if(x){ cnt++; have[x]=(have[x]||0)+1; }
      for(const x of pending) have[x]=(have[x]||0)+1;
      if(cnt>=limit) break;
      const need=x=>(want[x]||0)>(have[x]||0);
      let best=-1, bd=1e9;
      for(let c=0;c<COLS;c++){ const d=cols[c].findIndex(need); if(d>=0&&d<bd){ bd=d; best=c; } }
      if(best<0||cnt+bd+1>limit) break;                          // 파내도 벨트가 넘치지 않을 때만 판다
      pending.push(cols[best].shift()); idle=0;
    }
    if(++idle>N*4) return false;                                 // 4바퀴 동안 진전이 없으면 실패
  }
  return true;
}
// 무한 모드: 손님 k명째 기준 난이도
function endlessCfg(k){
  return { types:Math.min(3+Math.floor(k/8),TYPE_ORDER.length), customers:0, orderMin:3, orderMax:Math.min(4+Math.floor(k/8),8),
           capacity:18, mix:Math.min(1.2+k*0.03,3), loop:Math.max(END.loopMin,11-k*0.04), spawnGap:0.6 };
}
const END={patStart:62,patFloor:27,patDecay:105,patPerNeed:1.6,loopMin:7};
function patienceFor(served,need){
  const {patStart,patFloor,patDecay,patPerNeed}=END;
  return patFloor+(patStart-patFloor)*Math.exp(-served/patDecay)+need*patPerNeed;
}
const ENDLESS_ROWS=12;                  // 무한 모드에서 각 줄에 항상 쌓아 둘 재료 수
// 손님 1명을 예약하고 그 주문만큼의 재료를 대기열(pool)에 넣는다.
// 재료는 손님 순서(key)대로 줄 아래에 이어 붙으므로, 각 줄의 위쪽에는 항상 "곧 올 손님"의 재료가 온다.
// 섞임 폭(mix)이 3명 이내라서, 필요한 재료 위에 있는 것은 지금 앉아 있거나 바로 다음 손님의 재료뿐이다.
function genCustomer(){
  const i=G.gen++, cfg=endlessCfg(i), types=TYPE_ORDER.slice(0,cfg.types);
  let t; do{ t=pick(types); }while(t===G.lastType); G.lastType=t;
  const need=rnd(cfg.orderMin,cfg.orderMax); G.queue.push({type:t,need,look:randomLook()});
  let left=need; while(left>0){ const k=Math.min(left,rnd(1,3)); G.pool.push({type:t,k,key:i+Math.random()*cfg.mix}); left-=k; }
  G.pool.sort((a,b)=>a.key-b.key);
  while(G.pool.length&&G.pool[0].key<G.gen){             // 이후 손님의 key 는 모두 G.gen 이상이므로 순서가 확정된 것만 내보낸다
    const r=G.pool.shift(), idx=[0,1,2,3,4].sort((a,b)=>G.cols[a].length-G.cols[b].length), c=idx[Math.random()<0.7?0:1];
    for(let j=0;j<r.k;j++) G.cols[c].push(r.type);
  }
}
function refill(){                       // 가장 짧은 줄이 ENDLESS_ROWS 개가 될 때까지 계속 채운다
  let guard=0;
  while(Math.min(...G.cols.map(c=>c.length))<ENDLESS_ROWS&&guard++<80) genCustomer();
}
// 막힘 방지(0.5초마다): 앉아 있는 손님이 원하는 초밥이 벨트로 오는 중이 아닌데
// 그 재료가 너무 깊이 묻혀 있거나(여유 있을 땐 3칸, 인내심이 절반 아래면 1칸 초과)
// 벨트 여유 안에서 꺼낼 수 없으면, 가장 가까운 것을 그 줄의 맨 위로 끌어올린다.
function unblock(){
  const have={};
  for(const x of G.slots) if(x) have[x.type]=(have[x.type]||0)+1;
  if(G.ready!==null) have[G.ready]=(have[G.ready]||0)+1;
  for(const x of G.ingredients) have[x]=(have[x]||0)+1;
  for(const f of G.flying) have[f.type]=(have[f.type]||0)+1;
  const free=G.cfg.capacity-count()-1; if(free<=0) return;
  const seated=G.seats.filter(s=>s&&!s.leaving&&s.in>=1&&!have[s.type]).sort((a,b)=>a.pat/a.patMax-b.pat/b.patMax);
  for(const s of seated){
    let best=-1, bd=1e9;
    for(let c=0;c<COLS;c++){ const d=G.cols[c].indexOf(s.type); if(d>=0&&d<bd){ bd=d; best=c; } }
    const limit=s.pat/s.patMax<0.5?1:3;
    if(best<0||(bd<=limit&&bd+1<=free)) continue;           // 충분히 가까이 있다

const BELT_ART={w:399,h:255,left:38,right:361,top:42,bottom:210,rx:72,ry:71};
const BOARD_DIVIDERS=[20,85,155,226,294,360];

function beltPath(x,y,w,h){
  const {w:aw,h:ah,left,right,top,bottom,rx,ry}=BELT_ART;
  const points=[];
  function add(ax,ay){
    const px=x+ax/aw*w, py=y+ay/ah*h, prev=points.at(-1);
    points.push({x:px,y:py,s:prev?prev.s+Math.hypot(px-prev.x,py-prev.y):0});
  }
  function corner(cx,cy,start){
    for(let i=1;i<=12;i++){
      const angle=start+i*Math.PI/24;
      add(cx+rx*Math.cos(angle),cy+ry*Math.sin(angle));
    }
  }
  add(left+rx,top);
  add(right-rx,top);
  corner(right-rx,top+ry,-Math.PI/2);
  add(right,bottom-ry);
  corner(right-rx,bottom-ry,0);
  const bottomStart=points.at(-1);
  add(left+rx,bottom);
  corner(left+rx,bottom-ry,Math.PI/2);
  add(left,top+ry);
  corner(left+rx,top+ry,Math.PI);
  return {points,len:points.at(-1).s,topStart:points[0],bottomStart};
}

function layout(){

  L.bx0=W*0.06; L.bx1=W*0.94;
  L.by0=L.playTop+L.cs*0.92; L.by1=L.playBot-L.cs*0.92;
  const bw=L.bx1-L.bx0,bh=L.by1-L.by0;
  L.path=beltPath(L.bx0,L.by0,bw,bh);

  L.chef={x:W/2,y:L.inner.y+L.inner.h*0.56,s:Math.min(L.inner.w*0.42,L.inner.h*0.44)};

function pathAt(s){
  const {points,len}=L.path;
  s=((s%len)+len)%len;
  let lo=0, hi=points.length-1;
  while(hi-lo>1){
    const mid=(lo+hi)>>1;
    if(points[mid].s<=s) lo=mid; else hi=mid;
  }
  const a=points[lo], b=points[hi], t=(s-a.s)/(b.s-a.s);
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
}

  }
  // 완성한 초밥을 레일에 올릴 때까지 다음 재료를 조리하지 않는다.
  for(const f of G.flying) f.t+=dt/f.dur;
  while(G.flying.length&&G.flying[0].t>=1){
    G.ingredients.push(G.flying.shift().type);
  }
  if(G.ingredients.length&&G.ready===null&&G.chefServe===0){
    if(G.cookTime===null){
      G.cookTime=0; sfx.chop();
    } else G.cookTime+=dt;
    if(G.cookTime>=COOK_TIME){
      G.cookTime=null;
      G.ready=G.ingredients.shift();
      burst(L.prep.x,L.prep.y,3,{shape:'star',colors:['#fff','#ffe066'],speed:120,size:6,life:0.35,up:60});
    }
  }
  // 재료를 모두 보냈으면 남은 진행을 빨리 감는다
  const rush=!G.endless&&G.cols.every(c=>!c.length)&&!G.flying.length&&!G.ingredients.length, RX=rush?RUSH:1;
  if(rush&&!G.rush){ G.rush=true; floatText(W/2,L.barY-L.cs*0.4,'재료 끝!','#ff7a8a',24); }
  // 손님 등장 / 퇴장
  for(let i=0;i<4;i++){
    const s=G.seats[i];
    if(!s){
      if(!G.queue.length) continue;
      G.seatTimer[i]-=dt*RX;
      if(G.seatTimer[i]>0) continue;
      const c=G.queue.shift();
      const guest={type:c.type,need:c.need,look:c.look,in:0,out:0,leaving:false,bump:0};
      if(G.endless) guest.patMax=guest.pat=patienceFor(G.served,c.need);
      G.seats[i]=guest;
      continue;
    }
    s.in=Math.min(1,s.in+dt*RX/ARRIVE_TIME); s.bump=Math.max(0,s.bump-dt*4);
    if(s.in>=1&&s.orderAt===undefined){
      s.orderAt=G.time; sfx.arrive();
      const seat=L.seat[i];
      if(!reduceMotion.matches) burst(seat.bx,seat.y-L.cs*0.23,4,{shape:'star',colors:['#ffc83d','#fff'],size:5,speed:85,life:0.34,up:60});
    }
    if(G.endless&&s.in>=1&&!s.leaving){              // 무한 모드: 기다리다 지치면 떠난다
      s.pat-=dt;
      if(s.pat<=0){
        s.leaving=true; s.angry=true; G.lives--; G.shake=0.3; sfx.deny();
        G.queue.unshift({type:s.type,need:s.need,look:s.look});          // 남은 주문은 나중에 다시 온다
        floatText(L.seat[i].x,L.seat[i].top?L.seat[i].y+L.cs*0.9:L.seat[i].y-L.cs*0.75,'너무 늦어요…','#7f86b3',20);
        burst(L.seat[i].x,L.seat[i].y,8,{colors:['#9aa0c8','#c9cde6'],speed:120,size:7,life:0.6});
        if(G.lives<=0){ G.state='fail'; G.failReason='lives'; G.endT=1.0; G.shake=0.6; sfx.fail(); updateHud(); return; }
      }
    }
    if(s.leaving){ s.out+=dt*RX/LEAVE_TIME; if(s.out>=1){ G.seats[i]=null; G.seatTimer[i]=G.cfg.spawnGap; } }
  }
  // 벨트 회전: 빈 슬롯이 입구를 지나면 초밥을 올리고, 손님 앞을 지나면 손님이 가져감
  const len=L.path.len, sp=len/G.slots.length, stepF=dt/G.cfg.loop, step=stepF*len;
  const crossed=(pos,target)=>(((target-pos)%len)+len)%len<step;
  // 조리대에서 닿을 수 있는 가까운 칸은 입구를 정확히 통과하기 전후에도 사용한다.
  const entryReach=Math.min(sp*0.4,L.tw*0.93);
  for(let sub=0;sub<RX;sub++){
  const prev=G.offset*len; G.offset=(G.offset+stepF)%1;
  for(let i=0;i<G.slots.length;i++){
    const pos=(i*sp+prev)%len, it=G.slots[i];
    if(!it){
      const pastEntry=(pos-L.entryS+len)%len;
      if(G.ready!==null&&(pastEntry<=entryReach||len-pastEntry<=entryReach+step)){
        const travelTime=rush?RUSH_SERVE_TIME:SERVE_TIME;
        G.slots[i]={type:G.ready,born:G.time,travelTime};
        // 초밥이 레일에 닿기 전에는 다음 조리 동작을 시작하지 않는다.
        G.ready=null; G.chefServe=travelTime; sfx.pop();
      }
      continue;
    }
    for(let k=0;k<4;k++){
      const s=G.seats[k];
      if(s&&!s.leaving&&s.in>=1&&s.need>0&&s.type===it.type&&crossed(pos,L.seatS[k])){
        const p=pathAt(L.seatS[k]), se=L.seat[k];
        G.fx.push({kind:'fly',type:it.type,x0:p.x,y0:p.y,x1:se.bx,y1:se.y,t:0,dur:0.28});
        G.slots[i]=null; s.need--; s.bump=1; G.delivered++; updateHud();
        G.combo=(G.time-G.lastServe<1.6)?G.combo+1:1; G.lastServe=G.time;
        if(G.endless) G.score+=10+Math.min(G.combo-1,10)*2;
        burst(p.x,p.y,5,{shape:'star',colors:['#ffc83d','#fff','#ff7a8a'],speed:120,size:7,life:0.45});
        floatText(se.bx,se.top?se.y+L.cs*0.75:se.y-L.cs*0.5,G.combo>1?`콤보 x${G.combo}`:'+1',G.combo>1?'#ff7a8a':'#5cc97b',G.combo>1?20:18);
        if(s.need===0){
          s.leaving=true; sfx.done(); if(G.endless){ G.score+=50; G.served++; }
          burst(se.x,se.y,12,{shape:'heart',colors:['#ff7a8a','#ff9bb5','#ffc83d'],speed:170,size:8,life:0.8,up:90});
          floatText(se.x,se.top?se.y+L.cs*0.9:se.y-L.cs*0.75,pick(['냠냠!','맛있어요!','최고!','또 올게요!']),'#ff7a8a',22);
        } else sfx.serve(G.combo);
        break;
      }
    }
  }
  }
  // 클리어 판정
  if(!G.endless&&G.delivered>=G.total){ G.state='clear'; G.endT=G.rush?1.0:1.7; sfx.clear();
    for(let i=0;i<5;i++) burst(W*(0.15+i*0.175),L.playTop+(L.playBot-L.playTop)*0.5,10,{shape:i%2?'star':'rect',speed:260,size:9,life:1.1,up:160});
    progress.unlocked=Math.max(progress.unlocked,Math.min(MAX_STAGE,G.stage+1));
    progress.best=progress.best||{}; const bt=Math.round(G.time*10)/10; G.newBest=!progress.best[G.stage]||bt<progress.best[G.stage];
    if(G.newBest) progress.best[G.stage]=bt; progress.cleared=Math.max(progress.cleared||0,G.stage); save.set(progress); return; }
}

/* =====================================================================
   7. 그리기
   ===================================================================== */
function rr(g,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const circle=(x,y,r)=>{ ctx.beginPath(); ctx.arc(x,y,Math.max(0,r),0,Math.PI*2); };
const oval=(x,y,rx,ry)=>{ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2); };
const easeOut=t=>1-Math.pow(1-t,3);
function sprite(img,x,y,size){ ctx.drawImage(img,x-size/2,y-size/2,size,size); }

function drawArt(img,x,y,w,h){
  if(!img) return false;
  ctx.drawImage(img,x,y,w,h);
  return true;
}
function drawPerson(x,y,s,look,o={}){
  const r=s*0.46, INK='#5a3626';
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.fillStyle=look.hairC;
  if(look.hair===1){ oval(x,y+r*0.42,r*1.2,r*1.45); ctx.fill(); }
  if(look.hair===2){ circle(x-r*0.82,y-r*0.78,r*0.4); ctx.fill(); circle(x+r*0.82,y-r*0.78,r*0.4); ctx.fill(); }
  ctx.fillStyle=o.chef?'#fff':look.shirt; rr(ctx,x-r*1.12,y+r*0.8,r*2.24,r*2.2,r*0.8); ctx.fill();
  if(o.chef){ ctx.fillStyle=look.shirt; rr(ctx,x-r*0.55,y+r*1.2,r*1.1,r*1.8,r*0.25); ctx.fill(); }
  ctx.fillStyle=look.skin; circle(x,y,r); ctx.fill();
  ctx.fillStyle=look.hairC; ctx.beginPath(); ctx.arc(x,y-r*0.1,r*1.05,Math.PI,Math.PI*2);
  ctx.quadraticCurveTo(x+r*0.55,y-r*0.7,x+r*0.1,y-r*0.48); ctx.quadraticCurveTo(x-r*0.45,y-r*0.22,x-r*1.05,y-r*0.1); ctx.fill();
  if(o.chef){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#ecd9cf'; ctx.lineWidth=Math.max(1,r*0.06);
    for(const dx of [-0.55,0.55,0]){ circle(x+dx*r,y-r*1.35,r*0.55); ctx.fill(); ctx.stroke(); }
    rr(ctx,x-r*0.85,y-r*1.2,r*1.7,r*0.62,r*0.18); ctx.fill(); ctx.stroke();
  }
  // 얼굴
  const ex=r*0.4, ey=y+r*0.14;
  if(o.happy){ ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.4,r*0.11);
    for(const d of [-1,1]){ ctx.beginPath(); ctx.arc(x+d*ex,ey+r*0.06,r*0.15,Math.PI*1.12,Math.PI*1.88); ctx.stroke(); } }
  else { for(const d of [-1,1]){ ctx.fillStyle=INK; oval(x+d*ex,ey,r*0.13,r*0.175); ctx.fill();
      ctx.fillStyle='#fff'; circle(x+d*ex-r*0.04,ey-r*0.07,r*0.055); ctx.fill(); } }
  ctx.fillStyle='rgba(255,120,140,.5)'; oval(x-r*0.66,y+r*0.42,r*0.18,r*0.11); ctx.fill(); oval(x+r*0.66,y+r*0.42,r*0.18,r*0.11); ctx.fill();
  if(o.angry&&!o.happy){ ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.4,r*0.1);
    for(const d of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+d*r*0.58,ey-r*0.34); ctx.lineTo(x+d*r*0.24,ey-r*0.22); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x,y+r*0.5,r*0.14,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }
  else if(o.happy){ ctx.fillStyle='#e2556a'; ctx.beginPath(); ctx.arc(x,y+r*0.38,r*0.2,0,Math.PI); ctx.closePath(); ctx.fill(); }
  else { ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.2,r*0.085); ctx.beginPath(); ctx.arc(x,y+r*0.34,r*0.13,Math.PI*0.12,Math.PI*0.88); ctx.stroke(); }
}

function drawOrder(s,p,cs){
  const r=cs*0.44, x=p.bx, y=p.y-cs*0.05, dir=p.x>x?1:-1;
  const t=reduceMotion.matches?1:clamp((G.time-s.orderAt)/0.28,0,1);
  const scale=1-0.26*(1-t)**2+0.18*Math.sin(Math.PI*t)*(1-t);
  ctx.save();
  ctx.globalAlpha*=0.65+t*0.35;
  ctx.translate(x,y+r*0.12*(1-t)); ctx.scale(scale,scale);
  ctx.save(); ctx.scale(dir,1);
  const bubble=drawArt(SPR.ui.bubble,-r,-r,r*2*331/314,r*2);
  ctx.restore();
  if(!bubble){
    ctx.fillStyle='#fff3dc'; ctx.strokeStyle='#d08a60'; ctx.lineWidth=2; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(dir*r*0.72,r*0.18);
    ctx.lineTo(dir*r*1.1,r*0.87);
    ctx.lineTo(dir*r*0.43,r*0.74);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    circle(0,0,r); ctx.fill(); ctx.stroke();
  }
  const hasPatience=s.patMax>0;
  sprite(SPR.sushi[s.type],0,hasPatience?-r*0.14:0,r*1.48*(1+s.bump*0.08));

  const badgeR=r*0.35, bx=-dir*r*0.58, by=-r*0.60;
  if(!drawArt(SPR.ui.badge,bx-badgeR,by-badgeR,badgeR*2,badgeR*2)){
    ctx.fillStyle='#dd624c'; ctx.strokeStyle='#fff3dc'; ctx.lineWidth=1.5;
    circle(bx,by,badgeR); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle='#fff'; ctx.font=`${badgeR*1.6}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(s.need,bx,by+badgeR*0.06);

  if(hasPatience){
    const fraction=clamp(s.pat/s.patMax,0,1);
    const w=r*1.22,h=r*0.22,left=-w/2,top=r*0.43;
    rr(ctx,left,top,w,h,h/2);
    ctx.fillStyle='#dcc1a0'; ctx.fill();
    ctx.strokeStyle='#946240'; ctx.lineWidth=Math.max(0.8,r*0.032); ctx.stroke();
    ctx.clip();
    ctx.fillStyle=fraction>0.5?'#4d895b':fraction>0.25?'#cf871f':'#c54c42';
    ctx.fillRect(left,top,w*fraction,h);
  }
  ctx.restore();
}

function idleFrame(frames,offset){
  const time=G.time+offset, cycle=Math.floor(time/4.2), within=time%4.2;
  const blinking=!reduceMotion.matches&&(within<0.13||(cycle%3===2&&within>=0.25&&within<0.36));
  return (blinking&&frames?.blink)||frames?.idle;
}

function drawSeat(i){
  const s=G.seats[i]; if(!s) return;
  const p=L.seat[i], cs=L.cs, dir=p.top?1:-1;
  const k=s.leaving?1-easeOut(Math.min(1,s.out)):easeOut(s.in);
  ctx.save(); ctx.globalAlpha=clamp(k*1.4,0,1);
  const y=p.y+dir*(1-k)*cs*0.7 - Math.sin(s.bump*Math.PI)*cs*0.07;
  const happy=(s.leaving&&!s.angry)||s.bump>0;
  const angry=s.angry||(s.patMax&&s.pat/s.patMax<0.25);
  const guest=SPR.guests[s.look.guest];
  const waiting=s.in>=1&&!s.leaving&&!happy;
  const portrait=happy?guest?.happy:angry?guest?.angry:waiting?idleFrame(guest,1.4+i*0.78):guest?.idle;
  const side=cs*1.23;
  if(!drawArt(portrait||guest?.idle,p.x-side/2,y-cs*0.58,side,side)){
    drawPerson(p.x,y,cs,s.look,{happy,angry});
  }
  if(!s.leaving&&s.orderAt!==undefined) drawOrder(s,p,cs);
  ctx.restore();
}

function drawBelt(){
  const p=L.path, tw=L.tw, I=L.inner;
  // 주방 안쪽
  ctx.fillStyle='#b5e6dc'; rr(ctx,I.x-2,I.y-2,I.w+4,I.h+4,I.r); ctx.fill();
  ctx.save(); rr(ctx,I.x,I.y,I.w,I.h,I.r); ctx.clip();
  if(!drawArt(SPR.ui.kitchen,I.x,I.y,I.w,I.h)){
  ctx.fillStyle='rgba(255,255,255,.35)'; for(let i=0;i<6;i++){ rr(ctx,I.x+I.w*(0.06+i*0.16),I.y+I.h*0.08,I.w*0.1,I.h*0.16,4); ctx.fill(); }
  ctx.fillStyle='#93d6c9'; ctx.fillRect(I.x,I.y+I.h*0.62,I.w,I.h);
  const cw=I.w*0.7,chh=I.h*0.2; ctx.fillStyle='#ffe0a8'; ctx.strokeStyle='#e9b46a'; ctx.lineWidth=3;
  rr(ctx,W/2-cw/2,L.prep.y-chh/2,cw,chh,10); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  // 벨트
  if(!drawArt(SPR.ui.belt,L.bx0,L.by0,L.bx1-L.bx0,L.by1-L.by0)){
  const track=()=>{
    ctx.beginPath();
    ctx.moveTo(p.points[0].x,p.points[0].y);
    for(const point of p.points.slice(1)) ctx.lineTo(point.x,point.y);
    ctx.closePath();
  };
  ctx.strokeStyle='rgba(107,63,42,.18)'; ctx.lineWidth=tw+8; ctx.save(); ctx.translate(0,5); track(); ctx.stroke(); ctx.restore();
  ctx.strokeStyle='#f29aa8'; ctx.lineWidth=tw+8; track(); ctx.stroke();
  ctx.strokeStyle='#ffd3d9'; ctx.lineWidth=tw+1; track(); ctx.stroke();
  ctx.strokeStyle='#fff7f2'; ctx.lineWidth=tw-6; track(); ctx.stroke();
  }
  // 주방장과 도구는 벨트 테두리 앞에 표시한다.
  const cooking=G.cookTime!==null;
  const serving=G.chefServe>0;
  const stroke=cooking&&!reduceMotion.matches?Math.sin(Math.PI*G.cookTime/COOK_TIME):0;
  const reach=serving&&!reduceMotion.matches?G.chefServe/SERVE_TIME:0;
  const chefSize=Math.min(I.h*1.24,I.w*0.62);
  // 조리가 끝나면 완료 자세를 유지하고, 레일에 올린 뒤에만 기본 자세로 돌아간다.
  const pose=cooking?'cook':G.ready!==null||serving?'serve':'idle';
  const chefBottom=I.y+I.h+tw*0.15;
  ctx.save();
  ctx.translate(L.chef.x,chefBottom);
  ctx.rotate(stroke*0.075+reach*0.10);
  ctx.scale(1+stroke*0.04,1-stroke*0.05);
  const portrait=pose==='idle'?idleFrame(SPR.chef,0.9):SPR.chef[pose];
  if(!drawArt(portrait||SPR.chef.idle,-chefSize/2,-chefSize,chefSize,chefSize)){
    drawPerson(0,L.chef.y-L.chef.s*0.12-chefBottom,L.chef.s,CHEF,{chef:true,happy:cooking});
  }
  ctx.restore();
  // 조리대에는 다음 차례를 기다리는 재료만 표시한다.
  const waitingFrom=cooking?1:0, n=Math.min(G.ingredients.length-waitingFrom,6);
  const prepLeft=L.prep.x+chefSize*0.39;
  const ps=Math.min(L.item*0.65,I.h*0.3,(I.x+I.w-prepLeft)/6);
  for(let i=0;i<n;i++){
    sprite(SPR.ing[G.ingredients[i+waitingFrom]],prepLeft+(i+0.5)*ps,L.prep.y,ps);
  }
  // 빈 슬롯은 보이지 않고, 초밥만 레일 중심을 따라 이동한다.
  const N=G.slots.length, sp=p.len/N, size=Math.min(sp*0.95,tw*1.12);
  for(let i=0;i<N;i++){
    const it=G.slots[i]; if(!it) continue;
    const q=pathAt(i*sp+G.offset*p.len);
    const t=easeOut(clamp((G.time-it.born)/it.travelTime,0,1));
    const x=L.prep.x+(q.x-L.prep.x)*t;
    const y=L.prep.y+(q.y-L.prep.y)*t-Math.sin(t*Math.PI)*tw*0.18;
    sprite(SPR.sushi[it.type],x,y,size*(0.78+t*0.22));
  }
}

function drawBar(){
  const c=count(), cap=G.cfg.capacity, f=c/cap;
  const x=W*0.08,w=W*0.84,y=L.barY,h=L.barH;
  const art=SPR.ui.progress, scale=h/103, capWidth=56, capDraw=capWidth*scale;
  if(art){
    ctx.drawImage(art,capWidth,0,394-2*capWidth,103,x+capDraw-0.5,y,w-2*capDraw+1,h);
    ctx.drawImage(art,0,0,capWidth,103,x,y,capDraw,h);
    ctx.drawImage(art,394-capWidth,0,capWidth,103,x+w-capDraw,y,capDraw,h);
  }else{
    ctx.fillStyle='#a85e29'; rr(ctx,x,y,w,h,h/2); ctx.fill();
  }
  // ui_progress.webp의 크림색 창만 채워서 금색 테두리를 보존한다.
  ctx.save();
  const inset=20*scale, fillY=y+22*scale, fillW=w-2*inset, fillH=57*scale;
  rr(ctx,x+inset,fillY,fillW,fillH,fillH/2);
  if(!SPR.ui.progress){ ctx.fillStyle='#fff1d8'; ctx.fill(); }
  ctx.clip();
  if(f>0){
    ctx.fillStyle=f>=1?'#ff5a5a':f>0.75?'#ffa155':f>0.5?'#ffc83d':'#5cc97b';
    ctx.fillRect(x+inset,fillY,fillW*f,fillH);
    ctx.fillStyle='rgba(255,255,255,.24)'; ctx.fillRect(x+inset,fillY,fillW*f,fillH*0.32);
  }
  ctx.restore();
  ctx.fillStyle='#6b3f2a'; ctx.strokeStyle='#fff1d8'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.font=`${Math.min(17,h*0.57)}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const label=f>=1?`가득 찼어요! ${c} / ${cap}`:`${c} / ${cap}`;
  ctx.strokeText(label,x+w/2,y+h/2+1); ctx.fillText(label,x+w/2,y+h/2+1);
}

function drawBoard(){
  const {x,y,w,h}=L.board, hint=G.stage===1&&!G.tapped&&G.state==='play';
  const bottom=L.laneBottom-(hint?L.rowH:0);
  const wanted=G.seats[0]?.type||G.queue[0]?.type;
  const match=hint?G.cols.findIndex(col=>col[0]===wanted):-1;
  const cue=match>=0?match:G.cols.findIndex(col=>col.length);
  const pulse=reduceMotion.matches?0.65:0.5+Math.sin(G.time*6)*0.5;
  if(!drawArt(SPR.ui.board,x,y,w,h)){
    ctx.fillStyle='#fff1d8'; ctx.strokeStyle='#d68b4a'; ctx.lineWidth=3;
    rr(ctx,x,y,w,h,16); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#dfa15f';
    for(const lane of L.lanes) ctx.fillRect(lane.left-1,L.laneTop,2,L.laneBottom-L.laneTop);
    ctx.fillRect(L.lanes.at(-1).right-1,L.laneTop,2,L.laneBottom-L.laneTop);
  }
  for(let c=0;c<COLS;c++){
    const lane=L.lanes[c], col=G.cols[c];
    if(!col.length) continue;
    ctx.save();
    ctx.beginPath(); ctx.rect(lane.left+lane.w*0.07,L.laneTop,lane.w*0.86,bottom-L.laneTop); ctx.clip();
    const firstY=L.rowTop+G.colShift[c]*L.rowH;
    const highlightW=lane.w*0.78, highlightH=L.rowH*0.9;
    const guided=hint&&c===cue;
    ctx.fillStyle=guided?'#fff3bd':G.colFlash[c]>0?'#fff8e6':'#ffedc5';
    ctx.strokeStyle=guided?'#bb5e2b':'#d69556'; ctx.lineWidth=guided?1.7+pulse:1.5;
    rr(ctx,lane.x-highlightW/2,firstY-highlightH/2,highlightW,highlightH,highlightH*0.28); ctx.fill(); ctx.stroke();
    const n=Math.min(col.length,L.rows-(hint?1:0));
    for(let j=0;j<n;j++) sprite(SPR.ing[col[j]],lane.x,firstY+j*L.rowH,L.item*(j===0?1:0.88));
    ctx.restore();
  }
  if(hint){
    const lane=L.lanes[cue];
    if(lane){
      const arrowY=L.laneTop-10+pulse*5;
      ctx.beginPath();
      ctx.moveTo(lane.x-6,arrowY); ctx.lineTo(lane.x,arrowY+6); ctx.lineTo(lane.x+6,arrowY);
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.lineWidth=5; ctx.strokeStyle='#fff1d9'; ctx.stroke();
      ctx.lineWidth=2.5; ctx.strokeStyle='#a74e2b'; ctx.stroke();
    }
    const t='맨 위 재료를 톡!', fs=Math.min(clamp(W*0.041,12,17),L.rowH*0.46);
    ctx.font=`${fs}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw=ctx.measureText(t).width+24, ty=L.laneBottom-L.rowH/2;
    ctx.fillStyle='#593627'; rr(ctx,W/2-tw/2,ty-fs*0.78,tw,fs*1.56,fs); ctx.fill();
    ctx.fillStyle='#fff3d9'; ctx.fillText(t,W/2,ty+1);
  }
}

const CHEF={skin:'#ffd3b0',skinD:'#eeb089',hairC:'#6b4433',hair:0,shirt:'#ff7a8a'};
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=G?'#f0d6ad':'#ffe8d6'; ctx.fillRect(0,0,W,H);
  if(G&&G.shake>0){ const a=G.shake*14*L.u; ctx.translate((Math.random()-0.5)*a,(Math.random()-0.5)*a); }
  ctx.fillStyle='rgba(255,170,150,.2)';
  for(let yy=L.playTop;yy<L.playBot;yy+=34) for(let xx=(Math.round(yy/34)%2)*17;xx<W;xx+=34){ circle(xx,yy,7); ctx.fill(); }
  if(!G) return;
  ctx.save(); ctx.beginPath(); ctx.rect(-20,-20,W+40,L.playBot+24); ctx.clip();
  drawSeat(0); drawSeat(1);            // 위쪽 손님은 벨트 뒤
  drawBelt();
  drawSeat(2); drawSeat(3);            // 아래쪽 손님은 벨트 앞
  ctx.restore();
  drawBar(); drawBoard();
  for(const f of G.flying){ const e=easeOut(Math.min(1,f.t));     // 날아가는 재료
    const x=f.x0+(L.prep.x-f.x0)*e, y=f.y0+(L.prep.y-f.y0)*e-Math.sin(e*Math.PI)*L.cs*0.6;
    ctx.save(); ctx.translate(x,y); ctx.rotate(e*Math.PI*2); sprite(SPR.ing[f.type],0,0,L.item*(1.15-0.35*e)); ctx.restore(); }
  for(const f of G.fx){ const e=easeOut(f.t);
    sprite(SPR.sushi[f.type],f.x0+(f.x1-f.x0)*e,f.y0+(f.y1-f.y0)*e-Math.sin(e*Math.PI)*12,L.cs*0.55*(1-0.4*e)); }
  drawParts();
  if(G.rush&&G.state==='play'){     // 빨리 감기 표시
    const fs=clamp(W*0.05,14,20), t='빨리 감기 >>', y=L.playTop+fs*0.9;
    ctx.font=`${fs}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw=ctx.measureText(t).width+28; ctx.globalAlpha=0.75+0.25*Math.sin(G.time*12);
    ctx.fillStyle='#ff7a8a'; rr(ctx,W/2-tw/2,y-fs*0.85,tw,fs*1.7,fs); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(t,W/2,y+1); ctx.globalAlpha=1;
  }
  if(G.failReason==='full'){
    const a=0.26*Math.min(1,G.endT/0.8), g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
    g.addColorStop(0,'rgba(255,70,70,0)'); g.addColorStop(1,`rgba(255,70,70,${a})`); ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
  }
}

function decodeJwt(t){
  const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')));
}
async function kakaoIdentity(code){
  if(AUTH_CONFIG.kakaoTokenUrl){           // 서버가 붙으면 비밀키 교환은 서버가 한다
    const r=await fetch(AUTH_CONFIG.kakaoTokenUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,redirectUri:REDIRECT_URI})});
    if(!r.ok) throw new Error('kakao-server'); return r.json();
  }
  const r=await fetch('https://kauth.kakao.com/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=utf-8'},
    body:new URLSearchParams({grant_type:'authorization_code',client_id:AUTH_CONFIG.kakaoRestKey,redirect_uri:REDIRECT_URI,code})});
  const tok=await r.json().catch(()=>({}));
  if(!r.ok||!tok.access_token){ const e=new Error(tok.error_code||tok.error||'kakao-token'); e.kakao=tok.error_code; throw e; }
  const pr=await fetch('https://kapi.kakao.com/v2/user/me',{headers:{Authorization:'Bearer '+tok.access_token}});
  const me=await pr.json(); if(!pr.ok||!me.id) throw new Error('kakao-profile');
  return {id:String(me.id),name:me.kakao_account?.profile?.nickname||me.properties?.nickname||''};
}

  }));
}

// 로그인 페이지에서 돌아왔을 때 한 번 처리한다. 처리했으면 true.
async function handleAuthCallback(){
  const q=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.slice(1));
  const isKakao=q.has('code')||(q.has('error')&&q.has('state')), isGoogle=h.has('id_token')||(h.has('error')&&h.has('state')&&!h.has('access_token')), isNaver=h.has('access_token');
  if(!isKakao&&!isGoogle&&!isNaver) return false;
  const pend=pendingTake(); authBack=pend?.back||'settings';
  const fail=msg=>{ cleanUrl(); authMsg=msg; return 'fail'; };
  try{
    let provider, ident;
    if(isKakao){
      provider='kakao';
      if(!pend||pend.provider!=='kakao'||q.get('state')!==pend.state) return fail('로그인 요청이 만료됐어요. 다시 시도해 주세요.');
      if(q.get('error')) return fail('카카오 로그인을 취소했어요.');
      ident=await kakaoIdentity(q.get('code'));
    }else if(isGoogle){
      provider='google';
      if(!pend||pend.provider!=='google'||h.get('state')!==pend.state) return fail('로그인 요청이 만료됐어요. 다시 시도해 주세요.');
      if(h.get('error')) return fail('Google 로그인을 취소했어요.');
      const c=decodeJwt(h.get('id_token'));
      if(c.aud!==AUTH_CONFIG.googleClientId||c.nonce!==pend.nonce||!/accounts\.google\.com$/.test(c.iss)||c.exp*1000<Date.now()) return fail('Google 로그인 정보를 확인하지 못했어요.');
      ident={id:String(c.sub),name:c.name||''};
    }else{
      provider='naver';
      ident=await naverIdentity();
    }
    cleanUrl();
    const uid=provider+':'+ident.id;
    auth.session={uid,provider,name:ident.name,at:Date.now()};
    auth.accounts[uid]=Object.assign({provider,created:Date.now()},auth.accounts[uid]||{});
    authStore.set(auth);
    return 'ok';
  }catch(e){
    if(e.kakao==='KOE010') return fail('카카오 앱에 Client Secret 이 켜져 있어 서버 없이 로그인할 수 없어요. (개발자용 화면 참고)');
    if(e.kakao==='KOE006'||e.kakao==='KOE303') return fail('카카오 개발자 콘솔에 이 게임 주소가 Redirect URI 로 등록되지 않았어요.');
    return fail(PROVIDERS[isKakao?'kakao':isGoogle?'google':'naver'].label+' 로그인에 실패했어요. 잠시 후 다시 시도해 주세요.');
  }
}
function logout(){
  auth.session=null; authStore.set(auth);
  try{ naverSdk&&naverSdk.then(nl=>nl.logout&&nl.logout()).catch(()=>{}); }catch(e){}
}

function fb(){
  if(window.fbApi) return Promise.resolve(window.fbApi);
  return new Promise((res,rej)=>{ addEventListener('fb-ready',()=>res(window.fbApi),{once:true}); setTimeout(()=>rej(new Error('firebase-timeout')),12000); });
}
const pidOf=uid=>uid.replace(':','_');

// 로그인 직후: 이 계정이 Firebase 에 이미 닉네임이 있으면 그대로 쓰고, 없으면 닉네임 화면을 띄운다.
async function syncPlayer(){
  const u=auth.session; if(!u) return 'none';
  const api=await fb(), p=await api.getPlayer(pidOf(u.uid));
  if(p){ cacheNickname(p.nickname); return 'ok'; }
  if(auth.accounts[u.uid]) delete auth.accounts[u.uid].nickname; authStore.set(auth);
  return 'need';
}
// 로그인 전에 끝낸 무한 모드 기록은 잠시 보관했다가 로그인하면 올린다.
const pendingScore={
  get(){ try{ const o=JSON.parse(localStorage.getItem('sushi-pending')||'null'); return o&&Date.now()-o.at<86400000?o:null; }catch(e){ return null; } },
  set(e){ const o=this.get(); if(!o||e.s>o.s) try{ localStorage.setItem('sushi-pending',JSON.stringify(Object.assign({at:Date.now()},e))); }catch(x){} },
  clear(){ try{ localStorage.removeItem('sushi-pending'); }catch(e){} },
};
async function submitScore(e){
  const u=currentUser(); if(!u||!u.nickname) return {skipped:true};
  const api=await fb();
  return api.submit(pidOf(u.uid),u.nickname,{score:e.s,time:e.t,served:e.n});
}
async function flushPending(){
  const e=pendingScore.get(); if(!e) return null;
  try{ const r=await submitScore(e); if(!r.skipped) pendingScore.clear(); return r; }catch(x){ console.warn('[rank]',x); return null; }
}

function onUiClick(e){
  const b=e.target.closest('button'); if(!b||b.disabled) return; ac(); sfx.ui();
  if(b.dataset.pick){ const n=+b.dataset.pick; if(n===lobbySel) return startStage(n); lobbySel=n; return showTitle(); }
  if(b.dataset.stage) return startStage(+b.dataset.stage);
  const a=b.dataset.act; if(a!=='reset') resetArmed=false;
  const refresh=()=>(G&&G.state==='pause')?showPause():uiScreen==='settings'?showSettings():showTitle();
  if(a==='lobby-settings') return showSettings();
  if(a==='play-stage') return startStage(lobbySel);
  if(a==='resume'){ G.state='play'; hideOverlay(); }
  else if(a==='retry') startStage(G.stage,G.endless);
  else if(a==='endless') startStage(0,true);
  else if(a==='tab-stage'||a==='tab-endless'){ progress.tab=a.slice(4); save.set(progress); showTitle(); }
  else if(a==='next') startStage(G.stage+1);
  else if(a==='title'){ G=null; titlePage=-1; uiScreen='title'; showTitle(); }
  else if(a==='reset'){
    if(!resetArmed){ resetArmed=true; refresh(); }
    else { resetArmed=false; progress={unlocked:1,cleared:0,best:{},rank:[],tab:progress.tab,sfxOff:progress.sfxOff,bgmOff:progress.bgmOff}; save.set(progress); titlePage=0; refresh(); }
  }
  else if(a==='close'){ uiScreen=lobbyShown()?'title':'splash'; if(lobbyShown()) authBack='title'; hideOverlay(); }
  else if(a==='login'){ authMsg=''; if(G&&G.endless){ authBack='title'; progress.tab='endless'; save.set(progress); } showLogin(); }
  else if(a&&a.startsWith('login-')) startLogin(a.slice(6));
  else if(a==='logout'){ logout(); afterAuth(); }
  else if(a==='nick-save') saveNickname();
  else if(a==='auth-back'){ devArmed=''; afterAuth(); }
  else if(a==='dev'){ devUnlocked?showDev():showDevLock(); }
  else if(a==='dev-enter'){
    const i=document.getElementById('devPw');
    if(i&&i.value===DEV_PASSWORD){ devUnlocked=true; showDev(); }
    else { showDevLock('비밀번호가 맞지 않아요.'); const j=document.getElementById('devPw'); j.classList.add('shake'); }
  }
  else if(a==='dev-tool') runDevTool(b.dataset.tool);
  else if(a==='splash') showSplash();
  else if(a==='prev'){ titlePage--; showTitle(); }
  else if(a==='nextpage'){ titlePage++; showTitle(); }
  else if(a==='sfx'){ progress.sfxOff=!progress.sfxOff; save.set(progress); refresh(); }
  else if(a==='bgm'){ progress.bgmOff=!progress.bgmOff; save.set(progress); refresh(); }
}
card.addEventListener('click',onUiClick);
lobbyEl.addEventListener('click',onUiClick);
card.addEventListener('keydown',e=>{            // 입력칸에서 Enter = 확인
  if(e.key!=='Enter') return; e.stopPropagation();
  if(e.target.id==='nickInput') saveNickname();
  if(e.target.id==='devPw') card.querySelector('[data-act="dev-enter"]').click();
});
function pause(){ if(G&&G.state==='play'){ G.state='pause'; showPause(); } }
document.getElementById('pauseBtn').addEventListener('click',pause);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); ac();
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(y<L.board.y||y>L.board.y+L.board.h) return;
  const col=L.lanes.findIndex(lane=>x>=lane.left&&x<lane.right);
  if(col>=0) tapColumn(col);
});
window.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key>='1'&&e.key<='5') tapColumn(+e.key-1); if(e.key==='Escape') pause(); });
window.addEventListener('resize',layout);
if(window.ResizeObserver) new ResizeObserver(layout).observe(stageEl);

let lastT=0;
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000||0); lastT=t;
  if(G) update(dt);
  draw();
  requestAnimationFrame(frame);
}
window.__game={ get G(){return G;}, pendingScore, syncPlayer, get auth(){return auth;}, DEV_TOOLS, REDIRECT_URI, END, buildVerified, buildStage, solvable, tapColumn, startStage, count, update };   // 디버그/테스트용
layout();
const fontReady=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('20px Jua').catch(()=>{}),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
Promise.all([loadAssets(),fontReady,handleAuthCallback()]).then(([,,cb])=>{
  // 모드 선택(또는 무한 모드 결과)에서 로그인하고 돌아왔으면 타이틀을 건너뛰고 그 자리로 돌아간다.
  if(cb&&authBack==='title'){ hideSplash(); uiScreen='title'; } else showSplash();
  requestAnimationFrame(frame);
  if(cb==='ok'){                       // 로그인 직후: Firebase 에 닉네임이 있으면 이어 쓰고, 없으면 바로 닉네임 설정
    showCard('<h2>로그인 중…</h2><p>계정 정보를 확인하고 있어요.</p>',authView());
    syncPlayer().then(r=>{ if(r==='need') showNickname(); else { flushPending(); afterAuth(); } })
      .catch(e=>{ console.warn('[auth]',e); authMsg='순위 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.'; logout(); showLogin(); });
  }
  else if(cb==='fail') showLogin();
  else if(auth.session) syncPlayer().then(r=>{ if(r==='ok') flushPending(); }).catch(()=>{});   // 다른 기기에서 정한 닉네임 반영
  if(!cb) checkUpdate();
});
async function checkUpdate(){
  if(!/^https:/.test(location.protocol)) return;
  try{
    const html=await fetch(location.pathname,{cache:'reload'}).then(r=>r.ok?r.text():'');
    const v=(html.match(/const VERSION = '([^']+)'/)||[])[1];
    if(!v||v===VERSION) return;
    let tried=''; try{ tried=sessionStorage.getItem('sushi-updated')||''; }catch(e){}
    if(tried===v) return;                                   // 같은 버전으로 두 번 새로고침하지 않는다
    try{ sessionStorage.setItem('sushi-updated',v); }catch(e){}
    await Promise.all(['index.html','firebase.js'].map(f=>fetch(f,{cache:'reload'}).catch(()=>{})));
    if(!G) location.reload();                               // 게임 중이면 다음에 열 때 반영된다
  }catch(e){}
}
